name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install report parsers
        run: python -m pip install -r requirements-lock.txt
      - name: Formula, validation and API tests
        run: python -m unittest discover -s tests -v
      - name: Replay TEL case study
        run: python scripts/replay_tel_case.py
      - name: Replay BDO model consistency example
        run: python scripts/replay_bdo_case.py
      - name: Check AC ownership and claims worksheet
        run: python scripts/replay_ac_scope.py
      - name: Check JavaScript syntax
        run: node --check frontend/app.js
      - name: Build source package
        run: python scripts/package_project.py
      - name: Verify extracted app and startup
        run: python scripts/verify_package.py
